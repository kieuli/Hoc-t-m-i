<script>
(function(){
"use strict";
const KEY = "khoatu.v1";
const HOUR = 3600e3;
const INTERVALS = [0, 1*HOUR, 6*HOUR, 24*HOUR, 3*24*HOUR, 7*24*HOUR, 16*24*HOUR, 35*24*HOUR];
const LABEL = {intro:"Từ mới", meaning:"Nghĩa", listen:"Nghe", reverse:"Nhận mặt chữ", tone:"Thanh điệu",
  cloze:"Điền từ", dialog:"Hội thoại", order:"Xếp câu", speak:"Đọc từ", shadow:"Đọc câu", write:"Viết chữ", spell:"Viết từ"};
const PHASE = {intro:0, meaning:1, listen:1, reverse:1, tone:1, cloze:2, dialog:2, order:2, spell:3, write:3, speak:3, shadow:3};
const LANG_NAME = {zh:"Tiếng Trung", en:"Tiếng Anh"};
const FILLER = ["ngày mai","con mèo","bệnh viện","màu xanh","đi bộ","cái bàn","mua sắm","mùa hè","điện thoại","nhà hàng"];
const SAMPLE = [
  ["zh","你好","nǐ hǎo","xin chào"],["zh","谢谢","xiè xie","cảm ơn"],["zh","学习","xué xí","học tập"],
  ["zh","朋友","péng you","bạn bè"],["zh","喝水","hē shuǐ","uống nước"],["zh","老师","lǎo shī","giáo viên"],
  ["en","habit","","thói quen"],["en","borrow","","mượn"],["en","improve","","cải thiện"],
  ["en","schedule","","lịch trình"],["en","neighbor","","hàng xóm"]
];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const mkWord = (lang,text,pinyin,meaning,sample) => ({id:uid(),lang,text,pinyin:pinyin||"",meaning,box:0,due:0,seen:0,wrong:0,sample:!!sample});

function fresh(){
  return {words:SAMPLE.map(s=>mkWord(s[0],s[1],s[2],s[3],true)),
    settings:{perSession:3,langs:"zh",cooldown:15,outline:true,exPerWord:5},
    session:null,lastDone:0,lastSummary:[],history:[]};
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.words)){
      const r = Object.assign(fresh(), s, {settings:Object.assign(fresh().settings, s.settings||{})});
      if(r.settings.langs!=="zh" && r.settings.langs!=="en") r.settings.langs = "zh";
      return r;
    }
  }catch(e){}
  return fresh();
}
function autoPinyin(t){ try{ return window.pinyinPro && t ? window.pinyinPro.pinyin(t) : ""; }catch(e){ return ""; } }
// pinyin syllables as {b: base letters, t: tone 0-4}
function sylls(text){
  const han = hanOnly(text); if(!han || !window.pinyinPro) return [];
  try{
    return window.pinyinPro.pinyin(han, {toneType:"num", type:"array", v:true}).map(s=>{
      s = String(s).toLowerCase().replace(/ü/g,"v");
      const m = s.match(/^([a-z]+)([0-5]?)$/); if(!m) return null;
      const t = +m[2] || 0; return {b:m[1], t: t===5 ? 0 : t};
    }).filter(Boolean);
  }catch(e){ return []; }
}
const SPLIT_INI = s => { const m = s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?(.*)$/); return [m[1]||"", m[2]]; };
const NEAR = {z:"zh",zh:"z",c:"ch",ch:"c",s:"sh",sh:"s",n:"l",l:"n",an:"ang",ang:"an",en:"eng",eng:"en",in:"ing",ing:"in",f:"h",h:"f"};
function sylSim(a, b){
  if(a.b===b.b) return a.t===b.t || !a.t || !b.t ? 1 : 0.75;
  const [ia,fa] = SPLIT_INI(a.b), [ib,fb] = SPLIT_INI(b.b);
  const ini = ia===ib ? 1 : (NEAR[ia]===ib ? .7 : 0);
  const fin = fa===fb ? 1 : (NEAR[fa]===fb ? .7 : 0);
  const s = .4*ini + .6*fin;
  return s >= .5 ? s*.8 : 0;
}
// 0..1 how well `heard` covers the syllables of `target` (order-aware alignment)
function speechScore(target, heard){
  if(hanOnly(heard).includes(hanOnly(target))) return 1;
  const t = sylls(target), hs = sylls(heard);
  if(!t.length || !hs.length) return 0;
  const dp = Array.from({length:t.length+1}, ()=>new Array(hs.length+1).fill(0));
  for(let i=1;i<=t.length;i++) for(let j=1;j<=hs.length;j++)
    dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1], dp[i-1][j-1] + sylSim(t[i-1], hs[j-1]));
  return dp[t.length][hs.length] / t.length;
}
function lev(a, b){
  const d = Array.from({length:a.length+1}, (_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function speechScoreEn(target, heard){
  const t = normEn(target), words = normEn(heard).split(" ").filter(Boolean), n = t.split(" ").length;
  let best = 0;
  for(let i=0;i<words.length;i++){
    const cand = words.slice(i, i+n).join(" ");
    best = Math.max(best, 1 - lev(t.replace(/ /g,""), cand.replace(/ /g,"")) / Math.max(t.length, cand.length, 1));
  }
  return best;
}
const PASS = .6;
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null || v===false) continue;
    if(k==="class") el.className = v;
    else if(k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2), v);
    else if(k==="html") el.innerHTML = v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  for(const c of kids.flat()){ if(c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const svg = (inner, vb) => { const d=document.createElement("span"); d.innerHTML = `<svg viewBox="${vb||"0 0 24 24"}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`; return d.firstChild; };
const ICON = {
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  vol:'<path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="2.6"/>',
  play:'<path d="M7 5l12 7-12 7z"/>',
  redo:'<path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const isHan = c => /\p{Script=Han}/u.test(c);
const hanOnly = s => [...(s||"")].filter(isHan).join("");
const normEn = s => (s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' -]/g," ").replace(/\s+/g," ").trim();
const normVi = s => (s||"").toLowerCase().normalize("NFC").replace(/\s+/g," ").trim();
const byId = id => S.words.find(w=>w.id===id);

function pinyinKey(s){
  let letters="", tones="";
  const mark = {"̄":"1","́":"2","̌":"3","̀":"4"};
  for(const ch of (s||"").toLowerCase().normalize("NFD")){
    if(mark[ch]) tones += mark[ch];
    else if(ch>="1" && ch<="4") tones += ch;
    else if(ch>="a" && ch<="z") letters += (ch==="v" ? "u" : ch);
  }
  return {letters, tones};
}

/* ---------- speech out ---------- */
function say(text, lang){
  try{
    const ss = window.speechSynthesis; if(!ss) return false;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang==="zh" ? "zh-CN" : "en-US"; u.rate = lang==="zh" ? .8 : .9;
    const v = ss.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(lang==="zh"?"zh":"en"));
    if(v) u.voice = v;
    ss.speak(u); return true;
  }catch(e){ return false; }
}
try{ window.speechSynthesis && window.speechSynthesis.getVoices(); }catch(e){}
const speakBtn = (text, lang, label) => window.speechSynthesis ? h("button",{type:"button",class:"speak",onclick:()=>say(text,lang)}, svg(ICON.vol), label||"Nghe") : null;

/* ---------- speech in ---------- */
const NativeSR = window.SpeechRecognition || window.webkitSpeechRecognition;
const inArtifact = !!(window.claude && typeof window.claude.use==="function");
let dict = null, dictCtx = null;
if(inArtifact){
  window.claude.use("dictation").then(d=>{
    if(!d) return;
    dict = d;
    d.onFinal(({text})=>{ if(dictCtx){ dictCtx.final += text; dictCtx.live(dictCtx.final); } });
    d.onPartial(({text})=>{ if(dictCtx) dictCtx.live(text || dictCtx.final); });
    d.onState(({state,reason})=>{ if(dictCtx && state==="idle") dictCtx.end(reason); });
    if(currentTab==="learn" && S.session) renderLearn();
  }).catch(()=>{});
}
const micPossible = () => !!dict || (!!NativeSR && !inArtifact);

let sharedRec = null;
function getRec(){
  if(!sharedRec){ sharedRec = new NativeSR(); sharedRec.interimResults = true; sharedRec.maxAlternatives = 5; sharedRec.continuous = false; }
  return sharedRec;
}
function micTip(){
  const tip = h("div",{class:"note",hidden:true},
    "iPhone hỏi quyền micro mỗi lần mở trang? Trong Safari, bấm nút aA (hoặc biểu tượng trang) bên trái thanh địa chỉ → Cài đặt trang web → Micro → chọn Cho phép. Hoặc vào Cài đặt → Ứng dụng → Safari → Micro → Cho phép.");
  const link = h("button",{type:"button",class:"link",style:"font-size:13px;font-weight:500",onclick:()=>{ tip.hidden = !tip.hidden; }},"Bị hỏi quyền micro mỗi lần?");
  return h("div",{class:"center",style:"display:flex;flex-direction:column;gap:4px"}, link, tip);
}
function micWidget(lang, onResult){
  if(!micPossible()) return null;
  const label = h("span",{},"Bấm rồi đọc to");
  const btn = h("button",{type:"button",class:"mic"}, svg(ICON.mic), label);
  const live = h("div",{class:"heard","aria-live":"polite"});
  let on=false, stopFn=null, timer=null;
  function finish(alts, err){
    if(!on) return; on=false; clearTimeout(timer); dictCtx=null;
    btn.classList.remove("on"); label.textContent="Bấm rồi đọc to";
    alts = alts.map(a=>(a||"").trim()).filter(Boolean);
    onResult(alts, err, live);
  }
  btn.addEventListener("click", ()=>{
    if(on){ stopFn && stopFn(); return; }
    on=true; btn.classList.add("on"); label.textContent="Đang nghe… bấm để dừng"; live.textContent="";
    if(dict){
      const ctx = {final:"", live:t=>{live.textContent=t;}, end:r=>finish([ctx.final], (r==="stopped"||r==="viewer_stopped")?null:r)};
      dictCtx = ctx;
      dict.start({language: lang==="zh" ? "zh" : "en"}).catch(e=>finish([ctx.final], e && e.code));
      stopFn = ()=>{ dict.stop().catch(()=>{}); };
    } else {
      let alts=[], err=null;
      const rec = getRec();
      rec.lang = lang==="zh" ? "zh-CN" : "en-US";
      rec.onresult = e=>{ alts=[]; let t=""; for(const r of e.results){ for(const a of r) alts.push(a.transcript); t += r[0].transcript; } live.textContent = t; };
      rec.onerror = e=>{ err = e.error; };
      rec.onend = ()=>finish(alts, alts.length?null:err);
      try{ rec.start(); }catch(e){ finish([], "start"); }
      stopFn = ()=>{ try{rec.stop();}catch(e){} };
    }
    timer = setTimeout(()=>stopFn && stopFn(), 8000);
  });
  return h("div",{style:"display:flex;flex-direction:column;gap:6px"}, btn, live, dict ? null : micTip());
}
function micErrorText(err){
  if(err==="not-allowed" || err==="not_granted" || err==="service-not-allowed") return "Chưa được phép dùng micro. Bạn gõ đáp án bên dưới nhé.";
  if(err==="unavailable"){ dict=null; return "Micro không dùng được ở đây. Bạn gõ đáp án bên dưới nhé."; }
  return "Mình chưa nghe rõ. Bấm đọc lại, nói to và chậm hơn.";
}

/* ---------- session logic ---------- */
function pool(){
  return S.words.filter(w => w.lang===S.settings.langs);
}
// extra study content (example sentence, dialogue) for a word, from the built-in HSK 1 deck
let infoIdx = null;
function info(w){
  if(w.lang!=="zh") return {};
  if(!infoIdx){
    infoIdx = new Map();
    // first deck wins, but an entry with an example/dialogue beats one without
    const rich = x => !!(x && x[3] && x[5] && x[5].length);
    const put = (k, x) => { const old = infoIdx.get(k); if(!old || (!rich(old) && rich(x))) infoIdx.set(k, x); };
    ALL_ITEMS.forEach(x=>{ put(zhKey(x[0],x[1]), x); put(x[0], x); });
  }
  const x = infoIdx.get(zhKey(w.text,w.pinyin)) || infoIdx.get(w.text);
  if(!x) return {};
  return {ex: x[3] ? [x[3], x[4]||""] : null, dlg: x[5] && x[5].length ? x[5] : null};
}
function canDo(key, w){
  const inf = info(w);
  switch(key){
    case "cloze": return !!(inf.ex && inf.ex[0].includes(w.text));
    case "order": return !!(inf.ex && tokenize(inf.ex[0]).length >= 3);
    case "shadow": return !!(inf.ex && micPossible());
    case "dialog": return !!(inf.dlg && inf.dlg.some(l=>l[0].includes(w.text)));
    case "tone": return toneVariants(w).length >= 2;
    case "listen": case "reverse": return !!window.speechSynthesis || key==="reverse";
    default: return true;
  }
}
function makePlan(w){
  const n = S.settings.exPerWord || 5;
  const isNew = !w.seen;
  let order;
  if(w.lang==="zh"){
    const ctx = shuffle(["dialog","cloze","order"]).filter(k=>canDo(k,w));
    if(isNew) order = ["meaning", ctx[0], "write", "speak", "listen", "tone", ctx[1], "shadow"];
    else {
      const recog = shuffle(["meaning","listen","reverse","tone"]);
      const prod = w.box>=2 ? shuffle(["write","speak","shadow"]) : shuffle(["write","speak"]);
      order = [ctx[0], prod[0], recog[0], prod[1], ctx[1], recog[1], recog[2], ctx[2]];
    }
  } else {
    order = isNew ? ["meaning","listen","spell","speak","reverse"] : shuffle(["meaning","listen","reverse"]).slice(0,2).concat(shuffle(["spell","speak"]));
  }
  const seen = new Set();
  let plan = order.filter(k=>k && !seen.has(k) && seen.add(k) && canDo(k,w)).slice(0, n);
  plan.sort((a,b)=>PHASE[a]-PHASE[b]);
  if(isNew && w.lang==="zh") plan.unshift("intro");
  return plan;
}
function startSession(){
  const now = Date.now(), n = S.settings.perSession;
  const byDue = (a,b)=> (a.due-b.due) || (a.box-b.box);
  const p = pool();
  const dueReviews = p.filter(w=>w.seen && w.due<=now).sort(byDue);   // learned words whose review time has come
  const fresh = p.filter(w=>!w.seen).sort(byDue);                     // never studied, in list order
  const later = p.filter(w=>w.seen && w.due>now).sort(byDue);         // learned, not due yet
  // reviews first, but keep one slot for a new word so the list keeps moving
  const nRev = fresh.length ? Math.min(dueReviews.length, Math.max(n-1, 1)) : dueReviews.length;
  const pick = dueReviews.slice(0, nRev).concat(fresh, dueReviews.slice(nRev), later).slice(0, n);
  if(!pick.length){ S.session=null; save(); return false; }
  S.session = {items: pick.map(w=>({id:w.id, step:0, errors:0, plan:makePlan(w)})), idx:0};
  save(); return true;
}
function finishWord(it){
  const w = byId(it.id); if(!w) return;
  const now = Date.now();
  w.seen++;
  if(it.errors===0){ w.box = Math.min(w.box+1, INTERVALS.length-1); w.due = now + INTERVALS[w.box]; }
  else { w.wrong++; w.box = 0; w.due = now + 10*60e3; }
}
function finishSession(){
  S.lastSummary = S.session.items.map(it=>({id:it.id, ok:it.errors===0}));
  S.lastDone = Date.now();
  S.history.push({t:S.lastDone, n:S.session.items.length});
  if(S.history.length>500) S.history = S.history.slice(-500);
  S.session = null; save();
}

function renderLearn(){
  if(!pool().length){
    mount(h("div",{class:"card"},
      h("h2",{},"Chưa có từ để học"),
      h("p",{class:"muted center"}, `Danh sách ${LANG_NAME[S.settings.langs]} đang trống. Thêm vài từ để bắt đầu.`),
      h("button",{type:"button",class:"btn wide",onclick:()=>{ wordsLang=S.settings.langs; show("words"); }},"Thêm từ mới")));
    return;
  }
  if(S.session){ renderStep(); return; }
  const cool = S.settings.cooldown*60e3;
  if(S.lastDone && Date.now()-S.lastDone < cool){ renderUnlocked(); return; }
  startSession(); renderStep();

function progress(){
  const ses = S.session;
  const wrap = h("div",{class:"ticks","aria-hidden":"true"});
  ses.items.forEach((it,i)=>{
    const w = byId(it.id); if(w && !it.plan) it.plan = makePlan(w); const n = it.plan ? it.plan.length : 3;
    const g = h("div",{class:"grp"});
    for(let s=0;s<n;s++){
      const done = i<ses.idx || (i===ses.idx && s<it.step);
      const now = i===ses.idx && s===it.step;
      g.append(h("i",{class: done?"on":(now?"now":"")}));
    }
    wrap.append(g);
  });
  return wrap;
}

function renderStep(){
  const ses = S.session;
  while(ses.idx < ses.items.length && !byId(ses.items[ses.idx].id)) ses.idx++;
  if(ses.idx >= ses.items.length){ finishSession(); renderUnlocked(); return; }
  const it = ses.items[ses.idx], w = byId(it.id);
  if(!it.plan) it.plan = makePlan(w);
  const steps = it.plan;
  const key = steps[Math.min(it.step, steps.length-1)], label = LABEL[key];
  const card = h("div",{class:"card"});
  const fb = h("div",{"aria-live":"polite"});
  const meta = h("div",{class:"meta"}, h("span",{},`Từ ${ses.idx+1}/${ses.items.length}`), h("span",{},`Bước ${it.step+1}/${steps.length}: ${label}`));
  card.append(h("span",{class:"chip"}, LANG_NAME[w.lang]));
  mount(h("div",{style:"display:flex;flex-direction:column;gap:8px"}, progress(), meta), card, fb);

  let answered = false;
  const done = (ok, info) => {
    if(answered) return; answered = true;
    card.querySelectorAll("input,button.opt,.check").forEach(e=>e.disabled=true);
    if(ok){
      it.step++;
      if(it.step >= steps.length){ finishWord(it); save(); wordSummary(w, it, fb); }
      else { save(); fb.replaceChildren(h("div",{class:"fb ok"}, h("b",{}, info || "Đúng rồi!"))); setTimeout(()=>{ if(S.session===ses && currentTab==="learn") renderStep(); }, 750); }
    } else {
      it.errors++; save();
      fb.replaceChildren(h("div",{class:"fb bad"},
        h("div",{}, h("b",{},"Chưa đúng. "), info || ""),
        h("button",{type:"button",class:"btn wide",onclick:()=>renderStep()},"Làm lại bước này")));
      fb.querySelector("button").focus();
    }
  };
  const STEP_FN = {intro:stepIntro, meaning:stepMeaning, listen:stepListen, reverse:stepReverse, tone:stepTone,
    cloze:stepCloze, dialog:stepDialog, order:stepOrder, speak: w.lang==="zh" ? stepPinyin : stepSpeak, shadow:stepShadow,
    write:stepWrite, spell:stepSpell};
  (STEP_FN[key] || stepMeaning)(w, card, done, it);
}

function wordSummary(w, it, fb){
  const ses = S.session;
  const last = ses.idx === ses.items.length-1;
  let moved = false, timer = null;
  const go = () => {
    if(moved || S.session!==ses || currentTab!=="learn") return; moved = true; clearTimeout(timer);
    ses.idx++;
    if(ses.idx >= ses.items.length){ finishSession(); renderUnlocked(); }
    else { save(); renderStep(); }
  };
  timer = setTimeout(go, 2200);
  const box = h("div",{class:"fb ok"},
    h("div",{class:"sum"},
      h("b",{}, it.errors ? "Xong từ này (lần sau ôn lại sớm)" : "Thuộc rồi!"),
      h("div",{class: w.lang==="zh"?"han":"word", style:"font-size:44px"}, w.text),
      w.pinyin ? h("div",{class:"pin"}, w.pinyin) : null,
      h("div",{}, w.meaning),
      speakBtn(w.text, w.lang)),
    h("button",{type:"button",class:"btn wide",onclick:go}, last ? "Mở khóa ngay" : "Sang từ tiếp ngay"));
  fb.replaceChildren(box);
  say(w.text, w.lang);
  box.querySelector(".btn").focus();
}

function stepMeaning(w, card, done){
  card.append(wordHead(w), h("p",{class:"ask"},"Từ này nghĩa là gì?"));
  const others = [...new Set(distractors(w, 6).map(x=>x.meaning))];
  const fill = shuffle(FILLER.filter(f=>normVi(f)!==normVi(w.meaning) && !others.some(o=>normVi(o)===normVi(f))));
  const opts = shuffle([w.meaning, ...others.concat(fill).slice(0,3)]);
  const grid = h("div",{class:"opts"});
  opts.forEach(o=>{
    const b = h("button",{type:"button",class:"opt"}, o);
    b.addEventListener("click", ()=>{
      const ok = normVi(o)===normVi(w.meaning);
      b.classList.add(ok?"right":"wrong");
      if(!ok) grid.querySelectorAll(".opt").forEach(x=>{ if(normVi(x.textContent)===normVi(w.meaning)) x.classList.add("right"); });
      done(ok, ok ? null : h("span",{},"Nghĩa đúng là ", h("b",{}, w.meaning), "."));
    });
    grid.append(b);
  });
  card.append(grid);
}

function answerRow(placeholder, lang, onCheck){
  const inp = h("input",{type:"text",id:"ans",placeholder,autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false",lang: lang==="zh"?"zh-CN":"en", "aria-label":placeholder});
  const go = h("button",{type:"button",class:"btn check"},"Kiểm tra");
  const run = () => { if(inp.value.trim()) onCheck(inp.value); else inp.focus(); };
  go.addEventListener("click", run);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); run(); } });
  return {row:h("div",{class:"row"}, inp, go), inp};
}

// read `target` aloud; pass at PASS (60%) similarity
function speakTask(lang, target, card, done, it, askText){
  const scoreOf = a => lang==="zh" ? speechScore(target, a) : speechScoreEn(target, a);
  const mic = micWidget(lang, (alts, err, live)=>{
    if(!alts.length){ live.textContent = micErrorText(err); return; }
    let best = 0, bestAlt = alts[0];
    alts.forEach(a=>{ const s = scoreOf(a); if(s > best){ best = s; bestAlt = a; } });
    const pct = Math.round(best*100);
    if(best >= PASS) return done(true, `Độ chính xác ${pct}% · đạt!`);
    live.textContent = `Độ chính xác ${pct}%. Mình nghe thành “${bestAlt}”. Nghe mẫu rồi đọc lại, cần 60%.`;
  });
  if(mic){ card.append(h("p",{class:"ask"}, askText), mic); }
  else {
    card.append(h("p",{class:"ask"},"Máy này chưa dùng được micro. Nghe mẫu, rồi tự đọc to 3 lần."),
      h("button",{type:"button",class:"btn ghost wide check",onclick:()=>done(true,"Tốt lắm!")},"Mình đã đọc to 3 lần"));
  }
  card.append(skipSpeak(it, done));
}
function stepPinyin(w, card, done, it){

}

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#333"; }
const charCache = {};
function loadCharData(ch){
  if(charCache[ch]) return Promise.resolve(charCache[ch]);
  const enc = encodeURIComponent(ch), base = "https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/" + enc + ".json";
  return import(base + "/+esm").then(m=>m.default || m)
    .catch(()=>fetch(base).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }))
    .then(d=>{ if(!d || !d.strokes) throw new Error("no data"); charCache[ch]=d; return d; });
}

function stepWrite(w, card, done, it){
  card.append(
    h("div",{class:"prompt"}, h("div",{class:"mean"}, w.meaning), w.pinyin ? h("div",{class:"pin"}, w.pinyin) : null, speakBtn(w.text,"zh")),
    h("p",{class:"ask"},"Vẽ chữ Hán của từ này vào ô, đúng thứ tự nét"));
  const chars = [...w.text].filter(isHan);
  if(!chars.length) return done(true);
  const size = Math.max(200, Math.min(340, (card.clientWidth || 340) - 44));
  const strip = h("div",{class:"strip","aria-hidden":"true"});
  const padWrap = h("div",{class:"padwrap"});
  const status = h("div",{class:"heard","aria-live":"polite"});
  const actions = h("div",{});
  const bPlay = toolBtn(ICON.play, "Xem cách viết", ()=>cur && cur.play());
  const bRedo = toolBtn(ICON.redo, "Viết lại", ()=>cur && cur.reset());
  const bEye = toolBtn(ICON.eye, S.settings.outline ? "Ẩn chữ mờ" : "Hiện chữ mờ", ()=>{
    S.settings.outline = !S.settings.outline; save();
    bEye.setLabel(S.settings.outline ? "Ẩn chữ mờ" : "Hiện chữ mờ");
    cur && cur.outline(S.settings.outline);
  });
  card.append(chars.length>1 ? strip : null, padWrap, status, h("div",{class:"tools"}, bPlay, bRedo, bEye), actions);

  let i = 0, mistakes = 0, peeked = false, cur = null;
  let mode = window.HanziWriter ? "writer" : "canvas";
  const colors = {strokeColor:cssVar("--ink"), drawingColor:cssVar("--accent"), highlightColor:cssVar("--accent"), outlineColor:cssVar("--ghost"), radicalColor:null, drawingWidth:Math.round(size/14)};

  function drawStrip(){
    strip.replaceChildren(...chars.map((c,k)=>h("span",{class:k<i?"done":(k===i?"cur":"")}, k<i ? c : "")));
  }
  function nextChar(){
    if(i >= chars.length){
      if(peeked || mistakes > chars.length*3){ it.errors++; save(); }
      return done(true, peeked ? "Đã vẽ xong (có xem gợi ý)" : (mistakes ? `Vẽ xong · ${mistakes} lần sai nét` : "Vẽ chuẩn từng nét!"));
    }
    drawStrip(); status.textContent = chars.length>1 ? `Chữ ${i+1}/${chars.length}` : ""; actions.replaceChildren();
    cur = mode==="writer" ? writerPad(chars[i]) : canvasPad(chars[i]);
  }
  function charDone(m){ mistakes += m; i++; setTimeout(nextChar, 450); }

  function writerPad(ch){
    const box = gridBox(size), target = h("div",{class:"w"});
    box.append(target); padWrap.replaceChildren(box);
    let failed = false, busy = false;
    const wr = HanziWriter.create(target, ch, Object.assign({width:size,height:size,padding:12,showCharacter:false,showOutline:S.settings.outline,
      charDataLoader:(c,ok,err)=>{ loadCharData(c).then(ok, err); },
      onLoadCharDataError:()=>{ if(failed) return; failed=true; mode="canvas"; cur = canvasPad(ch); }}, colors));
    const quiz = ()=>wr.quiz({showHintAfterMisses:2, onComplete:d=>{ if(!failed) charDone(d.totalMistakes); }});
    quiz();
    return {
      play(){ if(busy) return; busy=true; peeked=true; wr.cancelQuiz(); wr.animateCharacter({onComplete:()=>{ wr.hideCharacter(); busy=false; quiz(); }}); },
      reset(){ if(busy) return; wr.cancelQuiz(); quiz(); },
      outline(on){ on ? wr.showOutline() : wr.hideOutline(); }
    };
  }

  function canvasPad(ch){
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const box = gridBox(size);
    const cv = h("canvas",{width:Math.round(size*dpr), height:Math.round(size*dpr), style:`width:${size}px;height:${size}px`, "aria-label":"Ô vẽ chữ"});
    box.append(cv); padWrap.replaceChildren(box);
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    const font = s => `700 ${s}px "Noto Serif SC","Songti SC",serif`;
    let strokes = [], showGlyph = false, fails = 0;
    function glyph(c, color, s){ c.fillStyle = color; c.font = font(s*0.8); c.textAlign="center"; c.textBaseline="middle"; c.fillText(ch, s/2, s/2+s*0.03); }
    function paint(){
      ctx.clearRect(0,0,size,size);
      if(S.settings.outline || showGlyph) glyph(ctx, showGlyph ? cssVar("--muted") : cssVar("--ghost"), size);
      ctx.strokeStyle = cssVar("--accent"); ctx.lineWidth = size/16; ctx.lineCap="round"; ctx.lineJoin="round";
      for(const s of strokes){ ctx.beginPath(); s.forEach((p,k)=> k ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); if(s.length===1) ctx.lineTo(s[0][0]+.1,s[0][1]); ctx.stroke(); }
    }
    try{ document.fonts && document.fonts.load(font(80), ch).then(paint, ()=>{}); }catch(e){}
    paint();
    const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*size/r.width, (e.clientY-r.top)*size/r.height]; };
    let drawing = false;
    cv.addEventListener("pointerdown", e=>{ e.preventDefault(); drawing=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} strokes.push([pt(e)]); paint(); });
    cv.addEventListener("pointermove", e=>{ if(!drawing) return; e.preventDefault(); strokes[strokes.length-1].push(pt(e)); paint(); });
    const end = ()=>{ drawing=false; };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    function check(){
      if(!strokes.length){ status.textContent = "Bạn chưa vẽ gì cả."; return; }
      const N = 64, sc = N/size;
      const mk = () => { const c = document.createElement("canvas"); c.width=c.height=N; return c.getContext("2d"); };
      const g = mk(); glyph(g, "#000", N);
      const k = mk(); k.scale(sc,sc); k.strokeStyle="#000"; k.lineWidth=size/16; k.lineCap="round"; k.lineJoin="round";
      for(const s of strokes){ k.beginPath(); s.forEach((p,j)=> j ? k.lineTo(p[0],p[1]) : k.moveTo(p[0],p[1])); if(s.length===1) k.lineTo(s[0][0]+.1,s[0][1]); k.stroke(); }
      const G = g.getImageData(0,0,N,N).data, K = k.getImageData(0,0,N,N).data;
      const on = (D,x,y) => x>=0 && y>=0 && x<N && y<N && D[(y*N+x)*4+3] > 60;
      let gp=0, cov=0, kp=0, ins=0;
      for(let y=0;y<N;y++) for(let x=0;x<N;x++){
        const gi = on(G,x,y), ki = on(K,x,y);
        if(gi){ gp++; if(ki) cov++; }
        if(ki){ kp++; let near=false; for(let dy=-3;dy<=3&&!near;dy++) for(let dx=-3;dx<=3;dx++) if(on(G,x+dx,y+dy)){ near=true; break; } if(near) ins++; }
      }
      const okCov = gp ? cov/gp : 0, okIn = kp ? ins/kp : 0;
      if(okCov >= 0.45 && okIn >= 0.75) return charDone(fails);
      fails++; mistakes++;
      status.textContent = okCov < 0.45 ? "Còn thiếu nét. Vẽ lại cho đủ nhé." : "Có nét bị lệch ra ngoài chữ. Vẽ lại nhé.";
      strokes = []; paint();
    }
    actions.replaceChildren(h("button",{type:"button",class:"btn wide",onclick:check},"Xong chữ này"));
    return {
      play(){ peeked = true; showGlyph = true; paint(); setTimeout(()=>{ showGlyph=false; paint(); }, 1500); },
      reset(){ strokes = []; paint(); },
      outline(){ paint(); }
    };
  }
  nextChar();
}

// words of the same language usable as wrong options
function distractors(w, n, sameLen){
  const seenT = new Set([w.text]);
  let cand = S.words.filter(x=>x.lang===w.lang && x.text!==w.text);
  if(w.lang==="zh") cand = cand.concat(ALL_ITEMS.map(x=>({text:x[0], pinyin:x[1], meaning:x[2], lang:"zh"})));
  cand = shuffle(cand);
  if(sameLen){ const L = [...w.text].length; cand.sort((a,b)=>(Math.abs([...a.text].length-L))-(Math.abs([...b.text].length-L))); }
  const out = [];
  for(const c of cand){ if(seenT.has(c.text) || normVi(c.meaning)===normVi(w.meaning)) continue; seenT.add(c.text); out.push(c); if(out.length>=n) break; }
  return out;
}
function choiceGrid(options, isRight, onPick, cls){
  const grid = h("div",{class:"opts"});
  options.forEach(o=>{
    const b = h("button",{type:"button",class:"opt"+(cls?" "+cls:"")}, o);
    b.addEventListener("click", ()=>{
      const ok = isRight(o);
      b.classList.add(ok?"right":"wrong");
      if(!ok) grid.querySelectorAll(".opt").forEach(x=>{ if(isRight(x.textContent)) x.classList.add("right"); });
      onPick(ok, o);
    });
    grid.append(b);
  });
  return grid;
}

const TONE_V = {a:"āáǎà", e:"ēéěè", i:"īíǐì", o:"ōóǒò", u:"ūúǔù", v:"ǖǘǚǜ"};
function markSyl(b, t){
  const s = b.replace(/v/g,"ü");
  if(!t) return s;
  const base = b;
  let idx = base.indexOf("a"); if(idx<0) idx = base.indexOf("e");
  if(idx<0 && base.includes("ou")) idx = base.indexOf("o");
  if(idx<0){ for(let k=base.length-1;k>=0;k--) if("aeiouv".includes(base[k])){ idx=k; break; } }
  if(idx<0) return s;
  return s.slice(0,idx) + TONE_V[base[idx]][t-1] + s.slice(idx+1);
}
function toneVariants(w){
  const sy = sylls(w.text);
  if(!sy.length || sy.length>4) return [];
  const k = pinyinKey(w.pinyin);
  if(sy.map(s=>s.b.replace(/v/g,"u")).join("") !== k.letters || sy.filter(s=>s.t).map(s=>s.t).join("") !== k.tones) return [];
  const fmt = arr => arr.map(s=>markSyl(s.b, s.t)).join(" ");
  const right = fmt(sy), set = new Set([right]);
  for(let tries=0; tries<40 && set.size<4; tries++){
    const v = sy.map(s=>({...s}));
    const toned = v.map((s,i)=>i).filter(i=>v[i].t || v.length===1);
    if(!toned.length) break;
    const i = toned[Math.floor(Math.random()*toned.length)];
    v[i].t = 1 + Math.floor(Math.random()*4);
    if(Math.random()<.3 && v.length>1){ const j = (i+1)%v.length; if(v[j].t) v[j].t = 1 + Math.floor(Math.random()*4); }
    set.add(fmt(v));
  }
  return [right, ...[...set].slice(1)];
}
function stepTone(w, card, done){
  const vars = toneVariants(w), right = vars[0];
  card.append(h("div",{class:"prompt"}, h("div",{class:"han"}, w.text), h("div",{class:"muted"}, w.meaning)),

  card.append(choiceGrid(shuffle(vars), o=>o===right, ok=>done(ok, ok ? null : h("span",{},"Đúng là ", h("b",{}, right), ".")), "popt"));
}

let vocabSet = null;
function tokenize(sentence){
  if(!vocabSet){ vocabSet = new Set(ALL_ITEMS.map(x=>x[0])); S.words.forEach(x=>{ if(x.lang==="zh") vocabSet.add(x.text); }); }
  const chars = [...hanOnly(sentence)], out = [];
  let i = 0;
  while(i < chars.length){
    let len = Math.min(4, chars.length - i);
    while(len > 1 && !vocabSet.has(chars.slice(i, i+len).join(""))) len--;
    out.push(chars.slice(i, i+len).join("")); i += len;
  }
  // keep the exercise small: merge into at most 7 pieces
  while(out.length > 7){ let k = 0, best = 99; for(let j=0;j<out.length-1;j++){ const L = out[j].length+out[j+1].length; if(L<best){best=L;k=j;} } out.splice(k, 2, out[k]+out[k+1]); }
  return out;
}
function stepOrder(w, card, done){
  const ex = info(w).ex, toks = tokenize(ex[0]), target = toks.join("");
  card.append(h("p",{class:"ask"},"Xếp các từ thành câu có nghĩa:"), h("div",{class:"prompt"}, h("div",{class:"mean",style:"font-size:20px"}, ex[1])));
  const ans = h("div",{class:"toks ans"}), bank = h("div",{class:"toks"});
  let order = shuffle(toks.map((t,i)=>({t,i})));
  if(order.map(o=>o.t).join("")===target && toks.length>1) order = order.slice(1).concat(order[0]);
  const picked = [];
  const check = h("button",{type:"button",class:"btn wide check",disabled:true},"Kiểm tra");
  function draw(){
    ans.replaceChildren(...(picked.length ? picked.map((o,k)=>h("button",{type:"button",class:"tok on",onclick:()=>{ picked.splice(k,1); draw(); }}, o.t)) : [h("span",{class:"note"},"Bấm từ bên dưới để xếp câu")]));
    bank.replaceChildren(...order.filter(o=>!picked.includes(o)).map(o=>h("button",{type:"button",class:"tok",onclick:()=>{ picked.push(o); draw(); }}, o.t)));
    check.disabled = picked.length !== toks.length;
  }
  check.addEventListener("click", ()=>{
    const got = picked.map(o=>o.t).join("");
    if(got===target){ say(ex[0],"zh"); done(true, ex[0]); }
    else done(false, h("span",{},"Câu đúng: ", h("b",{style:"font-family:var(--f-han)"}, ex[0])));
  });
  card.append(ans, bank, check);
  draw();
}

      h("p",{class:"muted center"}, left>0 ? `Bạn được nghỉ ${left} phút. Giờ có thể quay lại app đang dùng.` : "Hết giờ nghỉ. Mở lại app là có bài mới."),
      list.childElementCount ? list : null,

,[["太晚了，快去睡觉吧。","Muộn quá rồi, mau đi ngủ đi."],["好，我马上去。","Vâng, con đi ngay."]]],["说","shuō","nói","她对我说她明天想去玩。","Cô ấy nói với tôi ngày mai cô ấy muốn đi chơi.",[["老师说什么了？","Cô giáo đã nói gì vậy?"],["明天要考试。","Ngày mai phải thi."]]],["说话","shuōhuà","nói, trò chuyện","她不想跟我说话。","Cô ấy không muốn nói chuyện với tôi.",[["他怎么不说话？","Sao anh ấy không nói gì?"],["他今天不高兴。","Hôm nay anh ấy không vui."]]],["四","sì","số 4","我每天上四个小时的课。","Tôi mỗi ngày học 4 tiếng đồng hồ.",[["你一天上几个小时课？","Một ngày bạn học mấy tiếng?"],["四个小时。","Bốn tiếng."]]],["送","sòng","tặng, đưa cho","我送给妈妈一条裙子。","Tôi tặng cho mẹ một chiếc váy.",[["你送她什么了？","Bạn đã tặng cô ấy cái gì?"],["一本中文书。","Một quyển sách tiếng Trung."]]],["岁","suì","tuổi","你今年几岁？","Bạn năm nay bao nhiêu tuổi?",[["你儿子多大了？","Con trai bạn bao nhiêu tuổi rồi?"],["他今年五岁。","Năm nay cháu năm tuổi."]]],["他","tā","anh ấy, ông ấy (ngôi 3 chỉ","他是我认识的人。","Anh ấy là người tôi quen.",[["那个男生是谁？","Bạn nam kia là ai?"],["他是我哥哥。","Anh ấy là anh trai tôi."]]],["他们","tāmen","các anh ấy, bọn họ (nam)","他们是我的同学。","Họ là bạn học của tôi.",[["他们是你的同学吗？","Họ là bạn học của bạn à?"],["是，我们是一个班的。","Đúng, chúng tôi học cùng một lớp."]]],["她","tā","cô ấy, bà ấy (ngôi 3 chỉ nữ)","她很喜欢吃苹果。","Cô ấy thích ăn táo.",[["那个女孩儿是谁？","Cô bé kia là ai?"],["她是我妹妹。","Cô ấy là em gái tôi."]]],["她们","tāmen","các cô ấy","她们是我的好朋友。","Các cô ấy là bạn thân của tôi.",[["她们去哪儿了？","Các cô ấy đi đâu rồi?"],["去商场买衣服了。","Đi trung tâm thương mại mua quần áo rồi."]]],["太","tài","quá","今天太热了。","Hôm nay trời nóng quá.",[["这个包两百块。","Cái túi này hai trăm tệ."],["太贵了！","Đắt quá!"]]],["天","tiān","trời","天黑了，快到晚上了。","Trời tối rồi, sắp đến buổi tối rồi.",[["天黑了，我们回家吧。","Trời tối rồi, chúng ta về nhà thôi."],["好，我们走吧。","Được, chúng ta đi thôi."]]],["天气","tiānqì","thời tiết","今天天气很好。","Thời tiết hôm nay rất đẹp.",[["明天天气怎么样？","Thời tiết ngày mai thế nào?"],["明天会下雨。","Ngày mai sẽ mưa."]]],["听","tīng","nghe","我喜欢听音乐。","Tôi thích nghe nhạc.",[["你喜欢听歌吗？","Bạn có thích nghe nhạc không?"],["喜欢，我也爱唱歌。","Thích, tôi cũng thích hát."]]],["听到","tīngdào","nghe thấy","我听到她在外面叫我。","Tôi nghe thấy cô ấy tiếng cô ấy gọi tôi ở bên ngoài.",[["你听到我的话了吗？","Bạn có nghe thấy lời tôi nói không?"],["没有，请再说一次。","Không, bạn nói lại lần nữa đi."]]],["听见","tīngjiàn","nghe thấy","你听见他说的话了吗？","Bạn đã nghe thấy lời anh ấy nói chưa?",[["你听见有人叫你吗？","Bạn có nghe thấy có người gọi bạn không?"],["是吗？我去看看。","Thế à? Tôi đi xem thử."]]],["听写","tīngxiě","nghe viết","我听写的成绩很好。","Điểm nghe viết của tôi rất tốt.",[["明天有听写吗？","Ngày mai có nghe viết không?"],["有，你要准备一下儿。","Có, bạn phải chuẩn bị một chút."]]],["同学","tóngxué","bạn học","他是我的同学。","Anh ấy là bạn học của tôi.",[["他是你的同学吗？","Cậu ấy là bạn học của bạn à?"],["是，我们一起学汉语。","Đúng, chúng tôi cùng học tiếng Trung."]]],["图书馆","túshūguǎn","thư viện","图书馆里的人很多。","Người trong thư viện rất nhiều.",[["你在哪儿学习？","Bạn học ở đâu?"],["我在图书馆学习。","Tôi học ở thư viện."]]],["外","wài","ngoài","他站在门外。","Anh ấy đứng ở ngoài cửa.",[["他在家吗？","Anh ấy có ở nhà không?"],["不在，他在门外。","Không, anh ấy ở ngoài cửa."]]],["外边","wàibiān","bên ngoài","外边在下雨。","Bên ngoài đang mưa.",[["外边冷不冷？","Bên ngoài có lạnh không?"],["很冷，你多穿衣服。","Rất lạnh, bạn mặc thêm áo vào."]]],["外国","wàiguó","nước ngoài","她常看外国的电影。","Cô ấy thường xe phim nước ngoài.",[["你有外国朋友吗？","Bạn có bạn người nước ngoài không?"],["有两个，都很好。","Có hai người, đều rất tốt."]]],["外语","wàiyǔ","tiếng nước ngoài, ngoại ngữ","我会两种外语。","Tôi biết 2 ngoại ngữ.",[["你会说什么外语？","Bạn biết nói ngoại ngữ gì?"],["我会说汉语。","Tôi biết nói tiếng Trung."]]],["玩儿","wánr","chơi","你想去哪玩儿？","Bạn muốn đi đâu chơi?",[["明天我们去哪儿玩儿？","Ngày mai chúng ta đi đâu chơi?"],["去北京，好吗？","Đi Bắc Kinh, được không?"]]],["晚","wǎn","buổi tối, muộn","你来得太晚了。","Bạn đến quá muộn rồi.",[["对不起，我来晚了。","Xin lỗi, tôi đến muộn."],["没关系，请坐。","Không sao, mời ngồi."]]],["晚饭","wǎnfàn","cơm tối, bữa tối","我不想吃晚饭。","Tôi không muốn ăn cơm tối.",[["你吃晚饭了吗？","Bạn ăn cơm tối chưa?"],["还没有，我们一起吃吧。","Chưa, chúng ta cùng ăn nhé."]]],["晚上","wǎnshang","buổi tối","昨天晚上你几点睡觉？","Buổi tối hôm h ở đâu?"],["在楼上左边。","Ở trên lầu, bên trái."]]],["喜欢","xǐhuān","thích, được yêu thích","我喜欢吃桃子。","Tôi thích ăn đào.",[["你喜欢喝茶吗？","Bạn có thích uống trà không?"],["不，我爱喝牛奶。","Không, tôi thích uống sữa."]]],["下","xià","xuống dưới bên dưới","我们下楼吃饭吧。","Chúng ta xuống lầu ăn cơm nhé.",[["你在楼上吗？快下来！","Bạn ở trên lầu à? Mau xuống đây!"],["好，我马上来。","Được, tôi đến ngay."]]],["下班","xiàbān","tan làm","下班以后我们一起去吃饭吧。","Sau khi tan làm chúng ta đi ăn tối đi.",[["你几点下班？","Mấy giờ bạn tan làm?"],["六点，我们一起吃饭吧。","Sáu giờ, chúng ta cùng đi ăn nhé."]]],["下边","xiàbian","bên dưới","桌子下边有一个球。","Dưới gầm bàn có một quả bóng.",[["你的球在哪儿？","Quả bóng của bạn ở đâu?"],["在床下边。","Ở dưới gầm giường."]]],["下车","xià chē","xuống xe","我在下一站下车。","Tôi xuống xe ở bến kế tiếp.",[["我们在哪儿下车？","Chúng ta xuống xe ở đâu?"],["下一站，到了我叫你。","Trạm tới, đến nơi tôi gọi bạn."]]],["下次","xià cì","lần kế tiếp, lần sau","我下次有时间再来。","Lần sau tôi có thời gian sẽ lại đến đây.",[["对不起，今天我没时间。","Xin lỗi, hôm nay tôi không có thời gian."],["没关系，下次吧。","Không sao, lần sau nhé."]]],["下课","xiàkè","tan học","我六点下课。","6 giờ tối là tôi tan học.",[["你们几点下课？","Các bạn mấy giờ tan học?"],["十二点，我在门口等你。","Mười hai giờ, tôi đợi bạn ở cổng."]]],["下午","xiàwǔ","buổi chiều","下午我在家里看电视。","Buổi chiều tôi ngồi trong nhà xem phim.",[["你下午去哪儿？","Buổi chiều bạn đi đâu?"],["我去图书馆看书。","Tôi đến thư viện đọc sách."]]],["下雨","xià yǔ","đổ mưa","今天可能会下雨。","Chắc hôm nay sẽ có mưa đấy.",[["外边下雨了吗？","Bên ngoài mưa rồi à?"],["下了，你别出去了。","Mưa rồi, bạn đừng ra ngoài nữa."]]],["先","xiān","trước","你们先吃，我一会儿就到。","Các bạn cứ ăn trước đi, lát nữa tôi đến ngay.",[["我们先吃饭吧。","Chúng ta ăn cơm trước đã."],["好，我也饿了。","Được, tôi cũng đói rồi."]]],["先生","xiānsheng","quý ông (gọi tôn kính)","先生您好，您找谁？","Chào anh, anh muốn tìm ai ạ?",[["先生，您想喝什么？","Thưa ông, ông muốn uống gì?"],["请给我一杯茶。","Cho tôi một cốc trà."]]],["现在","xiànzài","hiện tại, bây giờ","你现在在哪儿？","Hiện tại bạn đang ở đâu?",[["现在几点了？","Bây giờ mấy giờ rồi?"],["十点半了。","Mười giờ rưỡi rồi."]]],["想","xiǎng","muốn, s iè","cua","玛丽第一次吃螃蟹。","Mary lần đầu ăn cua.",[["螃蟹好吃吗？","Cua có ngon không?"],["很好吃！","Rất ngon!"]]],["香肠","xiāng cháng","xúc xích, lạp xưởng","麦克买了香肠。","Mike đã mua xúc xích.",[["早饭吃什么？","Bữa sáng ăn gì?"],["面包和香肠。","Bánh mì và xúc xích."]]],["鸭","yā","vịt","河里有一只鸭。","Dưới sông có một con vịt.",[["那是鸡还是鸭？","Đó là gà hay vịt?"],["是鸭。","Là vịt."]]],["烤鸭","kǎo yā","vịt quay","北京烤鸭很有名。","Vịt quay Bắc Kinh rất nổi tiếng.",[["你吃过烤鸭吗？","Bạn ăn vịt quay bao giờ chưa?"],["吃过，很好吃。","Ăn rồi, rất ngon."]]],["有名","yǒu míng","nổi tiếng","这家饭馆很有名。","Nhà hàng này rất nổi tiếng.",[["这儿什么菜有名？","Ở đây món gì nổi tiếng?"],["烤鸭最有名。","Vịt quay nổi tiếng nhất."]]],["荤菜","hūn cài","món mặn (món có thịt cá)","今天有三个荤菜。","Hôm nay có ba món mặn.",[["你吃荤菜吗？","Bạn có ăn món mặn không?"],["不吃，我只吃蔬菜。","Không, tôi chỉ ăn rau."]]],["邻居","lín jū","hàng xóm","我的邻居是玛丽。","Hàng xóm của tôi là Mary.",[["你认识你的邻居吗？","Bạn có quen hàng xóm không?"],["认识，他们很好。","Có quen, họ rất tốt."]]],["客人","kè rén","khách","今天家里有客人。","Hôm nay nhà có khách.",[["客人几点来？","Khách mấy giờ đến?"],["晚上七点。","Bảy giờ tối."]]],["做饭","zuò fàn","nấu cơm, nấu ăn","妈妈在家做饭。","Mẹ đang nấu cơm ở nhà.",[["谁做饭？","Ai nấu cơm?"],["今天我做饭。","Hôm nay tôi nấu."]]],["忽然","hū rán","bỗng nhiên, đột nhiên","忽然下雨了。","Bỗng nhiên trời mưa.",[["你怎么回来了？","Sao bạn quay về rồi?"],["忽然下雨了。","Bỗng nhiên trời mưa."]]],["咚","dōng","cộc (tiếng gõ cửa)","咚咚咚！有人来了。","Cộc cộc cộc! Có người đến.",[["咚咚！谁啊？","Cộc cộc! Ai đấy?"],["是我，麦克。","Là tôi, Mike đây."]]],["而且","ér qiě","hơn nữa, mà còn","烤鸭便宜而且好吃。","Vịt quay rẻ mà còn ngon.",[["这家饭馆怎么样？","Nhà hàng này thế nào?"],["菜好吃，而且不贵。","Món ngon, mà còn không đắt."]]],["吻","wěn","hôn","妈妈吻了吻孩子。","Mẹ hôn hôn đứa bé.",[["她做什么了？","Cô ấy đã làm gì?"],["她吻了一下小猫。","Cô ấy hôn mèo con một cái."]]],["招待","zhāo dài","tiếp đãi, chiêu đãi","我们招待客人吃饭。","Chúng tôi mời khách ăn cơm.",[["你怎么招待客人？","Bạn tiếp đãi khách thế nào?"],["请他们吃烤鸭。","Mời họ ăn vịt quay."]]],["可爱","kě ài","đáng yêu","这只小猫真可爱。","Con mèo con này thật đáng yêu.",[["你看这个孩 ông?"],["会一点儿，不太好。","Biết chút ít, không giỏi lắm."]]],["高尔夫球","gāo ěr fū qiú","gôn (golf)","爸爸喜欢打高尔夫球。","Bố thích chơi gôn.",[["高尔夫球难不难？","Chơi gôn có khó không?"],["不难，可是很贵。","Không khó, nhưng đắt lắm."]]],["规则","guī zé","luật, quy tắc","你懂篮球规则吗？","Bạn có hiểu luật bóng rổ không?",[["这个比赛的规则是什么？","Luật của trận đấu này là gì?"],["我也不太清楚。","Mình cũng không rõ lắm."]]],["裁判员","cái pàn yuán","trọng tài","他是足球裁判员。","Anh ấy là trọng tài bóng đá.",[["那个裁判员是谁？","Trọng tài kia là ai vậy?"],["他是我们的老师。","Đó là thầy giáo của tụi mình."]]],["球迷","qiú mí","người hâm mộ (bóng), fan","麦克是个足球迷。","Mike là một fan bóng đá.",[["你是球迷吗？","Bạn là fan bóng đá à?"],["是，我最爱看足球。","Ừ, mình mê xem bóng đá nhất."]]],["犯规","fàn guī","phạm lỗi, phạm luật","他犯规了！","Anh ta phạm lỗi rồi!",[["裁判员说你犯规了。","Trọng tài nói cậu phạm lỗi."],["我没有碰他啊！","Mình đâu có chạm vào cậu ấy!"]]],["倒","dào","rót (nước/trà)","玛丽给我倒了一杯茶。","Mary rót cho tôi một tách trà.",[["请给我倒杯水。","Rót giúp mình cốc nước nhé."],["好，你等一下。","Được, đợi chút nhé."]]],["飞","fēi","bay","球飞出去了。","Quả bóng bay ra ngoài rồi.",[["你看，鸟飞得真高！","Nhìn kìa, chim bay cao quá!"],["是啊，真漂亮。","Ừ, đẹp thật."]]],["举","jǔ","giơ lên, nâng lên","请举手回答。","Hãy giơ tay rồi trả lời.",[["谁知道？请举手。","Ai biết? Giơ tay lên nào."],["老师，我知道！","Thưa cô, em biết ạ!"]]],["砍","kǎn","chặt, đốn","他在山上砍树。","Anh ấy đang chặt cây trên núi.",[["别砍这棵树！","Đừng chặt cây này!"],["好，我不砍了。","Được, tôi không chặt nữa."]]],["磕","kē","va, đập (vào vật cứng)","他的头磕在桌子上了。","Đầu cậu ấy va vào bàn.",[["你的腿怎么了？","Chân bạn bị sao vậy?"],["不小心磕了一下。","Lỡ va phải một cái."]]],["撞","zhuàng","đâm, va chạm","两个人撞在一起了。","Hai người va vào nhau.",[["小心，别撞到人！","Cẩn thận, đừng đâm vào người ta!"],["对不起，我没看见。","Xin lỗi, tôi không nhìn thấy."]]],["滚","gǔn","lăn","球滚到桌子下面了。","Quả bóng lăn xuống gầm bàn rồi.",[["球滚到哪儿去了？","Quả bóng lăn đi đâu rồi?"],["在那边，我去拿。","Ở đằng kia, để mình đi lấy."]]],["射门","shè mén","sút cầu môn","麦克射门，进了！","Mike sút, vào rồi!",[["他射门了吗？","Cậu ấy sút chưa?"],["射了，可是没进。","Sút rồi, nhưng không vào."]]],["守门员","shǒu mén yuán","thủ môn","他是我们队的守门员。","Cậu ấy là thủ môn của đội mình.",[["谁当守门员？","Ai làm thủ môn?"],["我来吧，我个子高。","Để mình, mình cao mà."]]],["三分之一","sān fēn zhī yī","một phần ba","我吃了三分之一。","Mình ăn một phần ba.",[["这个蛋糕你吃多少？","Cái bánh này bạn ăn bao nhiêu?"],["三分之一就够了。","Một phần ba là đủ rồi."]]],["挡","dǎng","chặn, cản","守门员把球挡住了。","Thủ môn đã chặn được bóng.",[["你挡住我了。","Bạn che mất mình rồi."],["对不起，我往旁边站。","Xin lỗi, mình đứng sang bên."]]],["张开","zhāng kāi","mở ra, dang ra","请张开嘴。","Hãy há miệng ra.",[["大夫，我嘴疼。","Bác sĩ ơi, tôi đau miệng."],["请张开嘴，我看看。","Há miệng ra, tôi xem nào."]]],["胳膊","gē bo","cánh tay","我的胳膊很疼。","Cánh tay tôi đau lắm.",[["你的胳膊怎么了？","Cánh tay bạn bị sao thế?"],["打球时撞了一下。","Lúc chơi bóng bị va một cái."]]],["紧张","jǐn zhāng","căng thẳng, hồi hộp","比赛前我很紧张。","Trước trận đấu tôi rất hồi hộp.",[["明天考试，你紧张吗？","Mai thi rồi, bạn có căng thẳng không?"],["有点儿紧张。","Hơi căng thẳng."]]],["松","sōng","lỏng","你的鞋带儿松了。","Dây giày của bạn lỏng rồi.",[["这个太松了。","Cái này lỏng quá."],["我帮你系紧一点儿。","Để mình buộc chặt lại cho."]]],["鞋","xié","giày","这双鞋很好看。","Đôi giày này đẹp lắm.",[["你的新鞋多少钱？","Giày mới của bạn bao nhiêu tiền?"],["二百块。","Hai trăm tệ."]]],["鞋带儿","xié dàir","dây giày","麦克的鞋带儿开了。","Dây giày của Mike bị tuột rồi.",[["你的鞋带儿开了！","Dây giày bạn tuột rồi kìa!"],["谢谢，我马上系。","Cảm ơn, mình buộc ngay."]]],["差劲儿","chà jìnr","kém, tệ","这场比赛踢得真差劲儿。","Trận này đá tệ thật.",[["你觉得他怎么样？","Bạn thấy anh ta thế nào?"],["太差劲儿了！","Tệ quá đi!"]]],["计","jì","kế, mưu kế","我们中了他的计。","Chúng ta trúng kế của anh ta rồi.",[["我有一计！","Mình có một kế!"],["什么计？快说！","Kế gì? Nói mau!"]]],["调虎离山","diào hǔ lí shān","điệu hổ ly sơn (dụ đối phương rời chỗ)","这是调虎离山计。","Đây là kế điệu hổ ly sơn.",[["他为什么跑那么远？","Sao cậu ấy chạy xa thế?"],["这是调虎离山！","Đây là điệu hổ ly sơn đấy!"]]],["系","jì","buộc, thắt (dây giày)","麦克在系鞋带儿。","Mike đang buộc dây giày.",[["等一下，我系鞋带儿。","Đợi chút, mình buộc dây giày."],["快点儿，要迟到了！","Nhanh lên, sắp muộn rồi!"]]],["盯","dīng","nhìn c const DECKS = [
  {id:"b3", short:"Bài 3", name:"Bài 3 · 明天见", items:B3, prio:true},
  {id:"b4", short:"Bài 4", name:"Bài 4 · 你去哪儿", items:B4, prio:true},

  {id:"hsk1", short:"HSK 1", name:"HSK 1", items:HSK1}
];
const ALL_ITEMS = DECKS.flatMap(d=>d.items);
function deckState(d){
  const have = new Set(S.words.filter(w=>w.lang==="zh").map(w=>zhKey(w.text,w.pinyin)));
  return {total:d.items.length, have:d.items.filter(x=>have.has(zhKey(x[0],x[1]))).length};
}
function importDeck(d){
  const byKey = new Map(S.words.filter(w=>w.lang==="zh").map(w=>[zhKey(w.text,w.pinyin), w]));
  const base = d.prio ? 0.5 + DECKS.indexOf(d)*0.1 : 1;
  const step = d.prio ? 0.0001 : 1;
  let added = 0, moved = 0;
  d.items.forEach((x,i)=>{
    const old = byKey.get(zhKey(x[0],x[1]));
    if(old){
      // already in the list (e.g. from HSK 1): bring it forward if not studied yet
      if(d.prio && !old.seen && old.due > base + i*step){ old.due = base + i*step; old.deck = d.id; moved++; }
      return;
    }
    const w = mkWord("zh", x[0], x[1], x[2], false);
    w.deck = d.id; w.due = base + i*step;
    S.words.push(w); added++;
  });
  S.session = null; save(); return {added, moved};
}
function deckCard(){
  const msg = h("div",{class:"note","aria-live":"polite","data-deckmsg":""});

  DECKS.forEach(d=>{
    const st = deckState(d);
    const row = h("div",{style:"display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px"},
      h("div",{style:"display:flex;justify-content:space-between;gap:8px;align-items:baseline"},
        h("b",{}, d.name), h("span",{class:"note"}, `${st.have}/${st.total} từ`)));
    if(st.have < st.total){
      row.append(h("button",{type:"button",class:"btn small"+(d.prio?"":" ghost"),onclick:()=>{
        const r = importDeck(d); renderWords();
        const m = document.querySelector("[data-deckmsg]");
        if(m) m.textContent = `${d.short}: đã thêm ${r.added} từ` + (r.moved ? `, ${r.moved} từ đã có được đưa lên học trước` : "") + ".";
      }}, st.have ? `Thêm ${st.total-st.have} từ còn thiếu` : `Thêm ${st.total} từ`));
    }
    if(S.words.some(w=>w.deck===d.id)){
      const label = `Xoá bộ ${d.short} khỏi danh sách`;
      const del = h("button",{type:"button",class:"del",style:"align-self:flex-start"}, label);
      del.addEventListener("click", ()=>{
        if(!del.classList.contains("confirm")){ del.classList.add("confirm"); del.textContent="Bấm lần nữa để xoá"; setTimeout(()=>{ del.classList.remove("confirm"); del.textContent=label; }, 3000); return; }
        S.words = S.words.filter(w=>w.deck!==d.id); S.session = null; save(); renderWords();
      });
      row.append(del);
    }
    card.append(row);
  });
  card.append(msg);
  return card;

function parseLines(text, lang){
  let added=0, skipped=0, dup=0;
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    const parts = line.split(/\s*(?:\||\t|=)\s*/).map(s=>s.trim()).filter(Boolean);
    let word, pin="", mean;
    if(lang==="zh"){
      if(parts.length>=3){ [word,pin] = parts; mean = parts.slice(2).join(", "); }
      else if(parts.length===2){ word = parts[0]; mean = parts[1]; pin = autoPinyin(hanOnly(word)); }
      else { skipped++; continue; }
      if(!hanOnly(word) || !pinyinKey(pin).letters){ skipped++; continue; }
    } else {
      if(parts.length>=2){ word = parts[0]; mean = parts.slice(1).join(", "); }
      else { skipped++; continue; }
    }
    if(S.words.some(x=>x.lang===lang && (lang==="zh" ? x.text===word : normEn(x.text)===normEn(word)))){ dup++; continue; }
    S.words.push(mkWord(lang, word, pin, mean, false)); added++;
  }
  save();
  return {added, skipped, dup};
}
function exportText(lang){
  return S.words.filter(w=>w.lang===lang).map(w=> lang==="zh" ? `${w.text} | ${w.pinyin} | ${w.meaning}` : `${w.text} | ${w.meaning}`).join("\n");
}

        h("summary",{},"Dán nhiều từ một lúc"),
        h("div",{class:"form",style:"margin-top:10px"},
          h("p",{class:"note",style:"margin:0"}, L==="zh" ? "Mỗi dòng một từ: chữ Hán | nghĩa. Muốn tự ghi pinyin thì: chữ Hán | pinyin | nghĩa." : "Mỗi dòng một từ: từ tiếng Anh | nghĩa tiếng Việt."),
          ta, addBulk, bulkMsg))),
    L==="zh" ? deckCard() : null,
    samples.length ? h("div",{class:"card",style:"gap:8px"},
      h("p",{class:"note",style:"margin:0"}, `Đang có ${samples.length} từ mẫu để bạn thử app. Thêm từ của bạn rồi xoá chúng đi.`),
      h("button",{type:"button",class:"btn small ghost",onclick:()=>{ S.words=S.words.filter(w=>!w.sample); if(S.session){S.session=null;} save(); renderWords(); }},"Xoá hết từ mẫu")) : null,
    h("div",{class:"card",style:"gap:0"},
      h("h3",{style:"margin-bottom:6px"}, `${mine.length} từ ${LANG_NAME[L].toLowerCase()}`),
      mine.length ? list : h("p",{class:"muted"},"Chưa có từ nào. Thêm ở ô phía trên.")),
    h("details",{class:"card"},
      h("summary",{},"Sao lưu danh sách"),
      h("p",{class:"note"},"Danh sách chỉ lưu trên trình duyệt này. Sao chép đoạn dưới cất vào Ghi chú, khi cần thì dán lại vào ô Thêm từ mới."),
      exp, copyBtn));
}

/* ---------- settings ---------- */
function segRow(label, opts, cur, set){
  return h("div",{style:"display:flex;flex-direction:column;gap:8px"}, h("h3",{},label),
    h("div",{class:"seg",role:"group","aria-label":label},
      ...opts.map(([v,t])=>h("button",{type:"button","aria-pressed":String(v===cur),onclick:()=>{ set(v); save(); renderSettings(); }}, t))));
}
function renderSettings(){
  const st = S.settings;
  mount(
    h("div",{class:"card"},
      segRow("Số từ mỗi lần mở", [[1,"1 từ"],[2,"2 từ"],[3,"3 từ"]], st.perSession, v=>{st.perSession=v;}),
      segRow("Số bài tập cho mỗi từ", [[3,"3 bài"],[5,"5 bài"],[7,"7 bài"]], st.exPerWord, v=>{st.exPerWord=v;}),
      h("p",{class:"note",style:"margin:0"},"Bài tập đổi theo mức nhớ: nghĩa, nghe, thanh điệu, điền từ, hội thoại, xếp câu, viết chữ, đọc từ, đọc câu. Từ mới có thêm thẻ giới thiệu."),
      segRow("Khi vẽ chữ Hán", [[true,"Hiện chữ mờ để tô"],[false,"Ẩn chữ mờ (khó hơn)"]], st.outline, v=>{st.outline=v;}),
      segRow("Được nghỉ sau khi học xong", [[5,"5 phút"],[15,"15 phút"],[30,"30 phút"],[60,"1 giờ"]], st.cooldown, v=>{st.cooldown=v;}),
      h("p",{class:"note",style:"margin:0"},"Trong giờ nghỉ, mở lại app sẽ không bị hỏi bài.")),
    h("div",{class:"card"},
      h("h3",{},"Bắt học mỗi khi mở mạng xã hội"),
      h("p",{class:"note",style:"margin:0"},"Cài một lần. Từ đó mỗi lần bạn mở TikTok, Facebook… điện thoại sẽ tự mở trang này trước."),
      h("b",{},"iPhone (app Phím tắt)"),
      h("p",{class:"note",style:"margin:0"},"Phím tắt 1, tên đúng là: Khoa Tu Xong"),
      h("ol",{class:"steps"},
        h("li",{},"Điều chỉnh ngày: Thêm 15 phút vào Ngày hiện tại."),
        h("li",{},"Định dạng ngày: Ngày đã điều chỉnh, kiểu ISO 8601."),
        h("li",{},"Lưu tệp: Ngày đã định dạng, tắt Hỏi nơi lưu, đường dẫn KhoaTu.txt, bật Ghi đè."),
        h("li",{},"Nếu Đầu vào phím tắt là tiktok → Mở ứng dụng TikTok. Thêm Nếu tương tự cho facebook, instagram…")),
      h("p",{class:"note",style:"margin:0"},"Tự động hóa cho từng app (vd TikTok): Ứng dụng → TikTok → Được mở → Chạy ngay lập tức"),
      h("ol",{class:"steps"},
        h("li",{},"Lấy tệp: KhoaTu.txt trong thư mục Phím tắt, tắt Lỗi nếu không tìm thấy."),
        h("li",{},"Lấy ngày từ đầu vào: Tệp."),
        h("li",{},"Nếu Ngày ở sau Ngày hiện tại → để trống. Ngược lại → Mở URL: link trang này thêm ?back=tiktok")),
      h("p",{class:"note",style:"margin:0"},"Học xong, trang tự gọi phím tắt Khoa Tu Xong để quay lại app và cho nghỉ 15 phút. Lần đầu Safari hỏi có mở Phím tắt không, chọn Mở."),
      h("b",{},"Android (app MacroDroid)"),
      h("ol",{class:"steps"},
        h("li",{},"Tạo macro mới. Kích hoạt: Mở ứng dụng → chọn các app mạng xã hội."),
        h("li",{},"Hành động: Mở trang web → dán link của trang này.")),
      h("p",{class:"note",style:"margin:0"},"Micro và bảng viết từng nét chạy tốt nhất khi mở trang bằng Chrome hoặc Safari.")),
    h("div",{class:"card",style:"gap:8px"},
      h("h3",{},"Bắt đầu lại"),
      h("p",{class:"note",style:"margin:0"},"Đưa mức nhớ của mọi từ về 0. Danh sách từ vẫn giữ nguyên."),
      (()=>{ const b=h("button",{type:"button",class:"del"},"Đặt lại tiến độ"); b.addEventListener("click",()=>{
        if(!b.classList.contains("confirm")){ b.classList.add("confirm"); b.textContent="Bấm lần nữa để đặt lại"; return; }
        S.words.forEach(w=>{w.box=0;w.due=0;w.seen=0;w.wrong=0;}); S.session=null; S.lastDone=0; save(); b.textContent="Đã đặt lại"; b.disabled=true; }); return b; })()));
}

show("learn");
})();
</script>
